name: Test notebooks

# Runs every course notebook inside Pyodide, the same Python-in-WebAssembly engine
# the JupyterLite site uses, and lists any that fail in the run's Summary page.
# It does not block the site from deploying; a red cross here means "a notebook
# needs fixing", not "the site is down".

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Must be the exact Pyodide the site loads: jupyterlite-pyodide-kernel 0.8.0 (requirements.txt)
  # loads 314.0.0 (from cdn.jsdelivr.net/pyodide/v314.0.0). Change the two together: notebooks can
  # behave differently on another 314.x (on 314.0.7 two Semester 1 notebooks crash in the browser).
  PYODIDE_VERSION: "314.0.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Pyodide
        id: cache-pyodide
        uses: actions/cache@v4
        with:
          path: pyodide
          key: pyodide-${{ env.PYODIDE_VERSION }}

      - name: Download Pyodide
        if: steps.cache-pyodide.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o pyodide.tar.bz2 \
            "https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-${PYODIDE_VERSION}.tar.bz2"
          tar xjf pyodide.tar.bz2
          rm pyodide.tar.bz2

      - name: Run the notebooks
        run: |
          node tools/test_notebooks_pyodide.mjs --pyodide pyodide --summary "$GITHUB_STEP_SUMMARY" \
            content/00_START_HERE.ipynb \
            content/Lectures \
            content/Assignments
