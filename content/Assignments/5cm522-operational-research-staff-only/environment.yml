# Conda environment for every script, notebook and test in this repository.
#   conda env create -f environment.yml
#   conda activate 5cm522-or
name: 5cm522-or
channels:
  - conda-forge
dependencies:
  - python=3.11
  # data and analysis
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - openpyxl>=3.1
  # notebooks
  - jupyterlab>=4.0
  - notebook>=7.0
  - ipykernel>=6.0
  # checks and tests (scripts/run_all_checks.py)
  - pytest>=7.4
  - nbclient>=0.9
  - nbformat>=5.9
  - pypdf>=4.0
  - pip
  # Optimisation, simulation and scheduling come from pip:
  # - OR-Tools is not published on conda-forge for Windows.
  # - OR-Tools 9.15 bundles its own HiGHS; HiGHS (highspy) 1.13+ clashes with it when both are
  #   loaded in one Python process, so highspy is pinned below 1.13. This combination is tested.
  - pip:
      - pyomo>=6.7,<7
      - highspy>=1.11,<1.13   # HiGHS LP/MILP solver used through Pyomo ("appsi_highs")
      - simpy>=4.1
      - ortools>=9.15,<9.16   # CP-SAT (job-shop scheduling)
