<h1 id="5cm522-week-6">5CM522 Week 6</h1>
<h2 id="agent-based-modelling-abm">Agent-Based Modelling (ABM)</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" lang="en-US" data-marpit-pagination="2" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="learning-outcomes">Learning Outcomes</h1>
<p>By the end, you should be able to:</p>
<ul>
<li>Define ABM precisely</li>
<li>Explain why ABM is used in OR</li>
<li>Describe rules of key ABMs (formally)</li>
<li>Predict and interpret emergent behaviour</li>
<li>Critically evaluate assumptions</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" lang="en-US" data-marpit-pagination="3" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="how-we-will-use-models-today">How We Will Use Models Today</h1>
<p>For each model:</p>
<ol>
<li><strong>Predict</strong> what will happen</li>
<li><strong>Run</strong> the simulation</li>
<li><strong>Observe</strong> patterns</li>
<li><strong>Explain</strong> why they occurred</li>
<li><strong>Critique</strong> assumptions</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" lang="en-US" data-marpit-pagination="4" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="what-is-agent-based-modelling">What is Agent-Based Modelling?</h1>
<p>Agent-Based Modelling is a <strong>computational simulation framework</strong> where:</p>
<ul>
<li>Agents follow explicit behavioural rules</li>
<li>Agents interact locally</li>
<li>System behaviour emerges over time</li>
</ul>
<p>Key idea:</p>
<blockquote>
<p>Macro patterns arise from micro interactions</p>
</blockquote>
</section>

<h1 id="abm-vs-classical-or">ABM vs Classical OR</h1>
<table>
<thead>
<tr>
<th>Classical OR</th>
<th>ABM</th>
</tr>
</thead>
<tbody>
<tr>
<td>Aggregate variables</td>
<td>Individual agents</td>
</tr>
<tr>
<td>Equilibrium focus</td>
<td>Dynamic behaviour</td>
</tr>
<tr>
<td>Closed-form models</td>
<td>Simulation</td>
</tr>
<tr>
<td>Homogeneous agents</td>
<td>Heterogeneous agents</td>
</tr>
</tbody>
</table>
<p>Key idea:</p>
<blockquote>
<p>Use ABM when interaction structure matters</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" lang="en-US" data-marpit-pagination="7" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="a-very-short-history">A Very Short History</h1>
<ul>
<li>Cellular automata → local rules</li>
<li>1970: Game of Life → emergence</li>
<li>1971: Schelling → segregation</li>
<li>Modern: economics, epidemics, traffic</li>
</ul>
<p>Takeaway:</p>
<blockquote>
<p>Simple rules → complex behaviour</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" lang="en-US" data-marpit-pagination="8" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="game-of-life-quick-intuition">Game of Life (Quick Intuition)</h1>
<p>Explore:</p>
<p><a href="https://playgameoflife.com/">https://playgameoflife.com/</a></p>
<p><strong>Predict:</strong></p>
<ul>
<li>Do patterns stabilise or grow?</li>
</ul>
<p><strong>Observe:</strong></p>
<ul>
<li>Oscillators, moving patterns, extinction</li>
</ul>
<p><strong>Insight:</strong></p>
<ul>
<li>Deterministic rules → unpredictable outcomes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" lang="en-US" data-marpit-pagination="9" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="abm-components">ABM Components</h1>
<p>Every model needs:</p>
<ul>
<li><strong>Agents</strong> – Individual entities that act according to rules</li>
<li><strong>State variables</strong> – Attributes describing each agent at time (t)</li>
<li><strong>Environment</strong> – Structure defining interactions (grid, network, space)</li>
<li><strong>Rules</strong> – How agent states update (often using neighbours and randomness)</li>
<li><strong>Time process</strong> – How updates occur (synchronous or asynchronous)</li>
<li><strong>Outputs</strong> – System-level measures used to analyse behaviour</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" lang="en-US" data-marpit-pagination="10" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="abm-design-choices">ABM Design Choices</h1>
<p>You must specify:</p>
<ul>
<li><strong>Decision rules</strong> – How agents act (deterministic or stochastic)</li>
<li><strong>Information</strong> – What agents can observe (local or global)</li>
<li><strong>Constraints</strong> – Limits on movement, resources, or actions</li>
<li><strong>Initial conditions</strong> – Starting configuration of agents and states</li>
<li><strong>Stopping rule</strong> – When the simulation ends</li>
</ul>
<p>If unclear → results are unreliable</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" lang="en-US" data-marpit-pagination="11" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="schelling-model">Schelling Model</h1>
<h2 id="intuition">Intuition</h2>
<ul>
<li>Agents prefer similar neighbours</li>
<li>If unhappy → move</li>
</ul>
<p><strong>Design choices:</strong></p>
<ul>
<li>Neighbourhood type</li>
<li>Update order</li>
<li>Search strategy</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" lang="en-US" data-marpit-pagination="12" style="--paginate:true;" data-marpit-pagination-total="31">
<h1 id="schelling-model-precise-rules">Schelling Model (Precise Rules)</h1>
<p>For each time step:</p>

<ul>
<li>Do traffic jams require accidents?</li>
</ul>

<h1 id="traffic-model-findings">Traffic Model (Findings)</h1>
<ul>
<li>Jams emerge spontaneously</li>
<li>Jams travel backwards</li>
<li>Randomness → instability</li>
</ul>
<p><strong>Key idea:</strong></p>
<blockquote>
<p>Phase transition from free flow to congestion</p>
</blockquote>
</section>

<h1 id="sir-model-abm-view">SIR Model (ABM View)</h1>
<p>States:</p>
<ul>
<li>S (susceptible)</li>
<li>I (infected)</li>
<li>R (recovered)</li>
</ul>
<p>This can be done with differential equations, here we will simulate it.</p>
<p><a href="https://en.wikipedia.org/wiki/Compartmental_models_(epidemiology)">https://en.wikipedia.org/wiki/Compartmental_models_(epidemiology)</a></p>
</section>

<h1 id="sir-model-rules">SIR Model (Rules)</h1>
<p>At each step:</p>
<ol>
<li>
<p>For each infected agent:</p>
<ul>
<li>Infect neighbour with probability <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.281ex" height="2.034ex" role="img" focusable="false" viewBox="0 -705 566 899"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FD" d="M29 -194Q23 -188 23 -186Q23 -183 102 134T186 465Q208 533 243 584T309 658Q365 705 429 705H431Q493 705 533 667T573 570Q573 465 469 396L482 383Q533 332 533 252Q533 139 448 65T257 -10Q227 -10 203 -2T165 17T143 40T131 59T126 65L62 -188Q60 -194 42 -194H29ZM353 431Q392 431 427 419L432 422Q436 426 439 429T449 439T461 453T472 471T484 495T493 524T501 560Q503 569 503 593Q503 611 502 616Q487 667 426 667Q384 667 347 643T286 582T247 514T224 455Q219 439 186 308T152 168Q151 163 151 147Q151 99 173 68Q204 26 260 26Q302 26 349 51T425 137Q441 171 449 214T457 279Q457 337 422 372Q380 358 347 358H337Q258 358 258 389Q258 396 261 403Q275 431 353 431Z"></path></g></g></g></svg></mjx-container></li>
</ul>
</li>
<li>
<p>Recover with probability <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.489ex;" xmlns="http://www.w3.org/2000/svg" width="1.229ex" height="1.486ex" role="img" focusable="false" viewBox="0 -441 543 657"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FE" d="M31 249Q11 249 11 258Q11 275 26 304T66 365T129 418T206 441Q233 441 239 440Q287 429 318 386T371 255Q385 195 385 170Q385 166 386 166L398 193Q418 244 443 300T486 391T508 430Q510 431 524 431H537Q543 425 543 422Q543 418 522 378T463 251T391 71Q385 55 378 6T357 -100Q341 -165 330 -190T303 -216Q286 -216 286 -188Q286 -138 340 32L346 51L347 69Q348 79 348 100Q348 257 291 317Q251 355 196 355Q148 355 108 329T51 260Q49 251 47 251Q45 249 31 249Z"></path></g></g></g></svg></mjx-container></p>
<p><strong>Interpretation:</strong></p>
<ul>
<li>Infection = Bernoulli trials</li>
<li>Recovery = stochastic duration</li>
</ul>
</li>
</ol>

<h1 id="what-abm-is-for">What ABM Is For</h1>

<ul>
<li>Understand mechanisms</li>
<li>Test scenarios</li>
</ul>
<h3 id="predictive-hard">Predictive (hard)</h3>

<li>Requires calibration</li>

<h1 id="common-pitfalls">Common Pitfalls</h1>
<ul>
<li>Over-interpreting results</li>
<li>Hidden assumptions</li>
<li>No sensitivity analysis</li>
<li>Treating simulation as truth</li>
</ul>
</section>

<h1 id="summary">Summary</h1>
<ul>
<li>ABM = computational experiments</li>
<li>Focus on mechanisms, not closed-form solutions</li>
<li>Outputs are patterns, not single answers</li>
<li>Interpretation requires critical thinking</li>
</ul>
</section>
